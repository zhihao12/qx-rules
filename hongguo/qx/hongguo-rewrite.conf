#!name=红果去广告重写@zhihao12
#!desc=红果短剧去广告重写：穿山甲接口与红果广告域名返回空 JSON（reject-dict），防 SDK 当网络错误重试。需开启 MITM 并信任证书。
#!homepage=https://github.com/zhihao12/qx-rules/tree/main/hongguo

hostname = *.pangolin-sdk-toutiao.com, *.pangolin-sdk-toutiao-b.com, *.pangolin-sdk-toutiao1.com

# 广告接口空响应：穿山甲广告接口（红果与番茄共用）
^https://[^/]*pangolin-sdk-toutiao[^/]*/api/ad/union/sdk/ url reject-dict
# 注：ads3/ads5-normal-lf.zijieapi.com 的整域 reject-dict 已于 2026-11-19 撤下，
# 疑似导致红果刷几个视频后黑屏转圈（原模块作者亦有此警告），待验证后再定。

# ===== 进阶（默认关闭，删掉行首 # 启用）=====
# 红果自家 API 也会下发广告，路径在 *.snssdk.com/api/ad/，域名层看不出来，只能靠重写。
# 代价：要把 *.snssdk.com 加进 hostname（字节全家桶主 API 域，解密面大），
# 且基础服务若被误伤会转圈卡顿。没有把握就别开，上面两条已经能去掉大部分广告。
# ^https://[^/]*\.snssdk\.com/api/ad/ url reject-dict
# 广告素材走字节通用图片 CDN，只能靠路径区分（需把 byteimg.com、pstatp.com 加进 hostname）
# ^https://[^/]*\.(?:pglstatp-toutiao|pstatp)\.com/(?:obj|img)/(?:ad-app-package|ad)/ url reject
# ^https://[^/]*\.byteimg\.com/(?:ad-app-package|web\.business\.image) url reject
