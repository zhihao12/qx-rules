# 红果去广告 · 分流规则（Quantumult X filter_remote）
# 维护：zhihao12 ｜ 汇总自社区 8 个公开来源交叉验证 + 真机误杀实测（见仓库 README）
# 用法：QX 配置 [filter_remote] 加一行订阅本文件，策略填 reject 即可（本文件已自带）
# 注意：本表必须排在字节系直连规则之前生效；filter_local 的规则优先于本表，
#       基础服务放行请写在 filter_local（见文末「绝不拦截」清单），不要写进本表。

# ===== 一、穿山甲 / Pangle 广告 SDK（核心，红果广告主要来源）=====
host-keyword, pangolin, reject
host-suffix, pglstatp-toutiao.com, reject
host-suffix, pglstatp-toutiao-b.com, reject

# ===== 二、字节广告 API（红果自己的广告请求域名）=====
host, ads3-normal.zijieapi.com, reject
host, ads5-normal.zijieapi.com, reject
host, ads3-normal-lf.zijieapi.com, reject
host, ads5-normal-lf.zijieapi.com, reject
host-wildcard, ads*-normal.zijieapi.com, reject
host-wildcard, ads*-normal-lf.zijieapi.com, reject

# ===== 三、广告素材签名域 =====
host, p6-ad-sign.byteimg.com, reject
host, p9-ad-sign.byteimg.com, reject
# p3-ad-sign 与抖音商城图片共用，下面这行若导致抖音图片异常就删它
host, p3-ad-sign.byteimg.com, reject

# ===== 四、广告跳转与效果追踪 =====
host, zlink.ugsdk.cn, reject
host, zlink.toutiao.com, reject
host, effect.snssdk.com, reject
host, ichannel.snssdk.com, reject

# ===== 五、视频广告 CDN（红果与番茄共用，只拦广告子域）=====
host-wildcard, *-reading-ad.qznovelvod.com, reject
host-wildcard, *-iosreadingvideo.qznovelvod.com, reject

# ===== 六、埋点 / 上报（不影响看剧，介意可整段删）=====
host, mon.toutiaocloud.net, reject
host, mon.toutiaocloud.com, reject
host, i.snssdk.com, reject
host, i-lq.snssdk.com, reject
host, is.snssdk.com, reject
host, is-lq.snssdk.com, reject
host, mcs.snssdk.com, reject
host, dig.bdurl.net, reject
host-wildcard, *applog.fqnovel.com, reject
host-wildcard, *-misc.fqnovel.com, reject

# ===== 可选（默认关闭，删掉行首 # 启用）=====
# 广告素材轮换子域一网打尽（p1/p2/p4 等），误伤面比第三段大
# host-keyword, ad-sign.byteimg.com, reject

# ===== 绝不拦截（写进 filter_local 放行，拦了红果会转圈卡顿）=====
# tnc*.snssdk.com / tnc*.zijieapi.com（配置下发）
# security.snssdk.com / security-lq.snssdk.com（安全校验）
# mssdk.zijieapi.com（风控基础服务）
# gecko3.zijieapi.com / gecko5.zijieapi.com（资源下发）
# lf-normal-gr-sourcecdn.bytegecko.com / lf-webcast-gr-sourcecdn.bytegecko.com（正片资源）
# 切勿整域拦截 zijieapi.com、snssdk.com、pstatp.com、bytedance.com（社区有模块这么写，红果必卡）
