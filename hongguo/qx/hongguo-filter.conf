# 红果去广告 · 分流（全量合并版，2026-11-20 重做）
# 来源交叉合并：HongGuo Lite Plus（k6nfmm7dbr-commits/hongguo-lite）、
# bluee1111/egern-hongguo-adblock、旧自建精选表（134 条）三方并集去重。
# 全部逐行自带 reject，opt-parser=false 订阅。
# 原则：只拦广告与埋点，不碰正片。reading-video 正片域、视频 CDN 整域、
# API 主域一律不拦；旧表里误入的跨 App 条目（喜马拉雅、B 站 PCDN、友盟等）
# 已剔除，各有专表负责。

# ── 穿山甲 / Pangle 广告 SDK ──────────────────────────
host-keyword, pangolin, reject
host-suffix, pglstatp-toutiao.com, reject
host-suffix, pglstatp-toutiao-b.com, reject
host-suffix, pangle.io, reject
host-suffix, ad.pangle.cn, reject
host-keyword, ad-union-sdk, reject

# ── 广告素材签名域 ────────────────────────────────────
host-keyword, -ad-sign.byteimg.com, reject
host-regex, ^p[0-9]+-developer-sign\.bytemaimg\.com$, reject

# ── 广告视频（与正片分开的 reading-ad 域，只拦广告段） ──
host-wildcard, *-reading-ad.qznovelvod.com, reject

# ── 字节广告 API 子域 ─────────────────────────────────
host-regex, ^ads[0-9]*-normal(-[a-z0-9]+)?\.zijieapi\.com$, reject
host-regex, ^minigame[0-9]*-normal(-[a-z0-9]+)?\.zijieapi\.com$, reject

# ── 电商推广接口 ──────────────────────────────────────
host-regex, ^(ecom[0-9]*-normal|ec[0-9]*-core|isaas[0-9]*-normal)-lq\.ecombdapi\.com$, reject

# ── 广告跳转 / 落地页 / 弹窗 ───────────────────────────
