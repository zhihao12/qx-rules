    out: apple.list
  - id: google
    url: https://magicrule.pages.dev/data/_shared/artifacts/Google_rules_d1123fc9c30418d4.list
    format: qx
    force_policy: Google
    out: google.list
  - id: crypto
    url: https://magicrule.pages.dev/data/_shared/artifacts/Cryptocurrency_rules_0710f1a0999885c4.list
    format: qx
    force_policy: 交易所
    out: crypto.list
  - id: paypal
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/PayPal/PayPal.list
    format: qx
    force_policy: PayPal
    out: paypal.list
  - id: youtube
    url: https://magicrule.pages.dev/data/_shared/artifacts/YouTube_rules_82fafe057cef879f.list
