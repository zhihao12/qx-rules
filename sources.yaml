  - id: discord
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Discord/Discord.list
    format: qx
    force_policy: 社交
    out: social.list
  - id: reddit
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Reddit/Reddit.list
    format: qx
    force_policy: 社交
