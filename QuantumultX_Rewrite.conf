^https?:\/\/tmeadcomm\.y\.qq\.com\/ url reject-200
^https?:\/\/[^/]*\.kuwo\.(?:cn|com)\/ url script-response-body https://raw.githubusercontent.com/WeiGiegie/666/main/bdyy.js
^https?:\/\/us\.l\.qq\.com\/exapp url script-response-body https://raw.githubusercontent.com/WeiGiegie/666/main/bdyy.js
^https?:\/\/xs\.gdt\.qq\.com\/style_factory\/template_list url script-response-body https://raw.githubusercontent.com/WeiGiegie/666/main/bdyy.js

