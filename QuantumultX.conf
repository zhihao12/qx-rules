# Quantumult X 懒人配置（公开版）
# 与维护者自用版同一套分流架构：20 张分流表由 qx-rules 仓库每日自动更新
# 使用前必做两件事：
# 1. 在 [server_remote]

# 【必填】你自己的机场订阅：把占位地址换成你的订阅链接，并删掉行首的分号
;https://example.com/api/v1/client/subscribe?token=xxxxxxxx, tag=我的机场, update-interval=172800, opt-parser=true, enabled=true

[general]

# 延迟测试地址
server_check_url= http://www.gstatic.com/generate_204

# 测试超时（毫秒）
server_check_timeout = 3000

# 配置图标
profile_img_url=https://github.githubassets.com/images/modules/site/integrators/google.png

# 节点 IP 检查
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/I-am-R-E/Functional-Store-Hub/Master/GeoLocationChecker/QuantumultX/IP-API.js

# 资源解析器
resource_parser_url=https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js

# 不经 QX 处理的路径
excluded_routes=239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32

# DNS 排除名单
dns_exclusion_list=*.10099.com.cn, *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.10086.cn

# 只屏蔽 STUN（QUIC 与 UDP 443 已放行，2026-11-13 实测 X 视频转圈根因就是 QUIC 被丢，转正保留）
udp_drop_list = STUN
dns_reject_domain_behavior = no-error-no-answer

[task_local]

# 任务脚本
# 流媒体解锁查询
event-interaction https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/streaming-ui-check.js, tag=流媒体解锁查询,img-url=arrowtriangle.right.square.system, enabled=true

# IP 纯净度查询
event-interaction https://ddgksf2013.top/scripts/server-info-pure.js, tag=节点纯净度详情, img-url=checkmark.shield.fill.system

# 节点阻断检测
event-interaction https://gist.githubusercontent.com/RavelloH/383354955aa3800e1d7e98666e11e16f/raw/block_check.js, tag=节点阻断检测, img-url=bolt.horizontal.icloud.fill.system, enabled=true

# 网络信息
event-interaction https://raw.githubusercontent.com/xream/scripts/main/surge/modules/network-info/net-lsp-x.js, tag=网络信息 𝕏, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png, enabled=true





