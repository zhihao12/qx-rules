# X 链接跳 App 重写（通用链接失效时的绕路方案，2026-11-21）
# 作用：浏览器打开 x.com / twitter.com 的帖子与主页链接时，QX 直接返回 302 跳进 X App 对应页面
# 代价：Safari 里没法看 x.com 网页版的帖子和主页（其他页面如设置、登录不受影响）；首次跳转 iOS 可能弹一次确认
# 帖子（普通形式）
^https?://(?:www\.|mobile\.)?(?:x\.com|twitter\.com)/[A-Za-z0-9_]+/status/(\d+) url 302 twitter://status?id=$1
# 帖子（/i/status 形式）
^https?://(?:www\.|mobile\.)?(?:x\.com|twitter\.com)/i/(?:web/)?status/(\d+) url 302 twitter://status?id=$1
# 个人主页（排除 home、search 等系统路径）
^https?://(?:www\.|mobile\.)?(?:x\.com|twitter\.com)/(?!home|explore|notifications|messages|search|settings|compose|login|signup|share|intent|hashtag|tos|privacy|about|download|i/)([A-Za-z0-9_]+)/?(?:\?.*)?$ url 302 twitter://user?screen_name=$1
hostname = x.com, twitter.com, www.x.com, www.twitter.com, mobile.twitter.com
