#!name=喜马拉雅去广告@zhihao12
#!desc=喜马拉雅去广告重写合并版：墨鱼版规则加奶思版规则，2026-11-19 合并。需开启 MITM 并信任证书；广告仍在请清缓存或重装应用。
#!homepage=https://github.com/zhihao12/qx-rules/tree/main/ximalaya

hostname = *.xima*.*, *.xmcdn.*, gslbali.ximalaya.com, search.ximalaya.com, searchwsa.ximalaya.com, mobile.ximalaya.com, mobilehera.ximalaya.com, mobwsa.ximalaya.com, m.ximalaya.com, mwsa.ximalaya.com

# ===== 墨鱼版规则 @ddgksf2013（脚本仍由原作者仓库托管）=====
# 首页顶部去除直播
^https?:\/\/.*\.xima.*\.com\/discovery-category\/customCategories url script-response-body https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/ximalaya_json.js
# 修复轮播 Ad 失效 Bug
^https?:\/\/.*\.xima.*\.com\/discovery-feed\/focus\/queryF url reject
# 播放页 Live
^https?:\/\/.*\.xima.*\.com\/mobile-playpage\/view\/ url reject
# MyInfo 红点提醒
^https?:\/\/.*\.xima.*\.com\/chaos-notice-web\/v1\/message\/preview\/list url reject
# 屏蔽大红包 Tips
^https?:\/\/.*\.xima.*\.com\/social-web\/bottomTabs\/dynamicEntrance\/status url reject
# 屏蔽 gif 弹窗 Ad
^https?:\/\/.*\.xmcdn\.com\/\w{8}\/\w{4}-\w{16}\/.+gif$ url reject
# gslb
^https?:\/\/gslb.*\.xima.*\.com\/ url reject
# 屏蔽 Aged 请求
^https?:\/\/.*\.xima.*\.com\/(dog-portal\/checkOld|(child-mobile\/child|aged-mobile\/aged)\/mode\/query) url reject
# 部分 Tab 弹窗
^https?:\/\/.*\.xima.*\.com\/discovery-feed\/isShowUserGiftPendant url reject
# 屏蔽红点提示
^https?:\/\/.*\.xima.*\.com\/mobile-user\/unread url reject
# 屏蔽 minor 请求
^https?:\/\/.*\.xima.*\.com\/mobile-user\/minorProtection\/pop url reject
# 屏蔽隐私搜集
^https?:\/\/.*\.xima.*\.com\/collector\/xl\/v\d url reject
# 屏蔽版本更新
^https?:\/\/.*\.xima.*\.com\/butler-portal\/versionCheck url reject
# 屏蔽开屏广告
^https?:\/\/(adse\.wsa|adse|adbehavior|xdcs-collector)\.xima.*\.com\/.* url reject
# 屏蔽位置请求
^https?:\/\/.*\.xima.*\.com\/mobile\/discovery\/v\d\/location url reject
# 屏蔽热搜词
^https?:\/\/.*\.xima.*\.com\/(hub\/)?hotWord url reject
# 屏蔽热搜 board
^https?:\/\/.*\.xima.*\.com\/(hub\/)?hotWordBillboard url reject
# 屏蔽搜索框定时 Ad
^https?:\/\/.*\.xima.*\.com\/(hub)?guideWord url reject
# 屏蔽实时 Ad 请求
^https?:\/\/.*\.xima.*\.com\/api\/v\d\/adRealTime url reject
# 屏蔽 ting Ad
^https?:\/\/.*\.xima.*\.com\/ting\/(loading|feed|home)? url reject
# 屏蔽首页横幅 Ad
^https?:\/\/.*\.xima.*\.com\/focus-mobile\/focusPic url script-response-body https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/ximalaya_json.js
# 屏蔽首页动态 Ad
^https?:\/\/.*\.xima.*\.com\/discovery-feed\/v\d\/mix url script-response-body https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/ximalaya_json.js
# 屏蔽 Tab 页滚动 Ad
^https?:\/\/.*\.xima.*\.com\/discovery-category\/v\d\/category url script-response-body https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/ximalaya_json.js
# 去除我的页面 Ad Tag
^https?:\/\/.*\.xima.*\.com\/mobile-user\/v\d\/homePage url script-response-body https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/ximalaya_json.js

